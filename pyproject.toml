[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "accolaide-ai-router"
version = "0.2.0"
description = "Policy-aware AI model router with governance, audit logging, and EU AI Act compliance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Accolaide" }]
keywords = ["ai", "router", "governance", "audit", "eu-ai-act"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["headroom-ai"]

[project.optional-dependencies]
governance-extra = ["flask"]
adapters = ["google-generativeai", "openai", "requests"]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["accolaide_ai_router"]

[tool.hatch.build.targets.sdist]
include = [
    "/accolaide_ai_router",
    "/LICENSE",
    "/README.md",
    "/MANIFEST.in",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
